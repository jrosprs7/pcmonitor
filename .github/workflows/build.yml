name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Smoke test (app starts and keeps running for 20 s)
        shell: pwsh
        run: |
          $p = Start-Process dist\standalone\TaskbarMonitor.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "TaskbarMonitor exited early (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id
          Write-Host "App ran for 20 s without crashing."

      - uses: actions/upload-artifact@v4
        with:
          name: TaskbarMonitor-standalone
          path: dist/standalone/TaskbarMonitor.exe

      - uses: actions/upload-artifact@v4
        with:
          name: TaskbarMonitor-small
          path: dist/small/TaskbarMonitor.exe
