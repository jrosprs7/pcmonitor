name: Release

# Publish a version: raise <Version> in TaskbarMonitor.csproj and push to main.
# If no release exists for that version yet, this builds both exes on Windows, stamps them for
# self-update, and publishes GitHub Release v<Version> (GitHub creates the tag).
# Users always get the newest via .../releases/latest/download/TaskbarMonitor.exe
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version, skip if already released
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = ([xml](Get-Content TaskbarMonitor.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version in TaskbarMonitor.csproj must look like 1.2.3, got '$v'" }
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          $skip = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($skip) { Write-Host "v$v is already released; nothing to do." } else { Write-Host "Releasing v$v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "skip=$($skip.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        if: steps.ver.outputs.skip == 'false'
        with:
          dotnet-version: '8.0.x'

      - name: Build
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $v = $env:VERSION
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none `
            -p:Version=$v -p:UpdateAsset=TaskbarMonitor.exe -o out\standalone
          if ($LASTEXITCODE) { throw "standalone build failed" }
          dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none `
            -p:Version=$v -p:UpdateAsset=TaskbarMonitor-small.exe -o out\small
          if ($LASTEXITCODE) { throw "small build failed" }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item out\standalone\TaskbarMonitor.exe release\TaskbarMonitor.exe
          Copy-Item out\small\TaskbarMonitor.exe release\TaskbarMonitor-small.exe

      - name: Smoke test
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        run: |
          $p = Start-Process release\TaskbarMonitor.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "TaskbarMonitor exited early (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id

      - name: Publish GitHub Release
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.version }}
        run: |
          $notes = @"
          **Download:** [TaskbarMonitor.exe](https://github.com/${{ github.repository }}/releases/download/$env:TAG/TaskbarMonitor.exe) (runs on any Windows 10/11 PC, nothing to install).

          Smaller alternative: TaskbarMonitor-small.exe needs the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0).

          Already installed? It updates itself automatically within a few hours, or right-click it → Updates → Check for updates now.
          "@
          gh release create $env:TAG release\TaskbarMonitor.exe release\TaskbarMonitor-small.exe `
            --target "${{ github.sha }}" --title "Taskbar Monitor $env:TAG" --notes $notes --generate-notes

      # End-to-end check of auto-update: run the previous release and wait for it to replace itself
      # with this one. Needs a public repo (the app checks GitHub without signing in).
      - name: Update test (previous release updates itself to this one)
        if: steps.ver.outputs.skip == 'false' && github.event.repository.private == false
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.version }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $prev = gh release list --repo "${{ github.repository }}" --json tagName --jq '.[].tagName' |
                  Where-Object { $_ -ne $env:TAG } | Select-Object -First 1
          if (-not $prev) { Write-Host "No previous release to update from; skipping."; exit 0 }
          New-Item -ItemType Directory -Force updtest | Out-Null
          gh release download $prev --repo "${{ github.repository }}" --pattern TaskbarMonitor.exe --dir updtest
          $exe = (Resolve-Path updtest\TaskbarMonitor.exe).Path
          Write-Host "Starting $prev; it should update itself to $env:TAG within a few minutes."
          Start-Process $exe | Out-Null
          $deadline = (Get-Date).AddMinutes(5)
          do {
            Start-Sleep -Seconds 10
            $ver = (Get-Item $exe).VersionInfo.FileVersion
          } until ($ver -like "$env:VERSION*" -or (Get-Date) -gt $deadline)
          Start-Sleep -Seconds 10
          $running = Get-Process TaskbarMonitor -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe }
          Get-Process TaskbarMonitor -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($ver -notlike "$env:VERSION*") { throw "Update test failed: exe is still version $ver" }
          if (-not $running) { throw "Update test failed: the updated app did not restart" }
          if (Test-Path "$exe.old") { Write-Warning "Leftover $exe.old was not cleaned up" }
          Write-Host "Update test passed: $prev updated itself to $ver and restarted."
