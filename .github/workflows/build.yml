name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Smoke test + taskbar screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($file) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($file)
            $g.Dispose(); $bmp.Dispose()
          }
          New-Item -ItemType Directory -Force screenshots | Out-Null

          # Run 1: labels inside the rings (default)
          $p = Start-Process dist\standalone\TaskbarMonitor.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "TaskbarMonitor exited early (exit code $($p.ExitCode))" }
          Shot "screenshots\labels.png"
          Stop-Process -Id $p.Id; Start-Sleep -Seconds 2

          # Run 2: numbers inside the rings
          New-Item -Path HKCU:\Software\TaskbarMonitor -Force | Out-Null
          Set-ItemProperty -Path HKCU:\Software\TaskbarMonitor -Name RingShowsNumber -Value 1 -Type DWord
          $p = Start-Process dist\standalone\TaskbarMonitor.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "TaskbarMonitor exited early (exit code $($p.ExitCode))" }
          Shot "screenshots\numbers.png"
          Stop-Process -Id $p.Id
          Write-Host "App ran without crashing."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

      - uses: actions/upload-artifact@v4
        with:
          name: TaskbarMonitor-standalone
          path: dist/standalone/TaskbarMonitor.exe

      - uses: actions/upload-artifact@v4
        with:
          name: TaskbarMonitor-small
          path: dist/small/TaskbarMonitor.exe
