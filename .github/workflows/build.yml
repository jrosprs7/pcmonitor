name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only used to push screenshots to the ci-screenshots branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        shell: cmd
        run: build.cmd

      - name: CPU accuracy check (app vs typeperf, with load in the middle)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $n = [Environment]::ProcessorCount
          $tp = Start-Process typeperf -ArgumentList '"\Processor Information(_Total)\% Processor Utility" "\Processor(_Total)\% Processor Time" -si 1 -sc 22 -f CSV -o screenshots\typeperf.csv -y' -PassThru -NoNewWindow
          $d = Start-Process dist\standalone\TaskbarMonitor.exe -ArgumentList '--diag', 'screenshots\diag.csv', '22' -PassThru
          Start-Sleep -Seconds 7
          $busy = [math]::Max(1, [int]($n / 2))
          $jobs = 1..$busy | ForEach-Object { Start-Job { $end = (Get-Date).AddSeconds(9); while ((Get-Date) -lt $end) { } } }
          Wait-Process -Id $d.Id, $tp.Id -Timeout 90
          $jobs | Stop-Job -PassThru | Remove-Job
          "cores=$n busy_threads=$busy" | Out-File screenshots\info.txt
          Get-Content screenshots\diag.csv
          Get-Content screenshots\typeperf.csv

      - name: Smoke test + taskbar screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($file) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($file)
            $g.Dispose(); $bmp.Dispose()
          }
          New-Item -ItemType Directory -Force screenshots | Out-Null

          # Run 1: labels inside the rings (default)
          $p = Start-Process dist\standalone\TaskbarMonitor.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "TaskbarMonitor exited early (exit code $($p.ExitCode))" }
          Shot "screenshots\labels.png"
          Stop-Process -Id $p.Id; Start-Sleep -Seconds 2

          # Run 2: numbers inside the rings
          New-Item -Path HKCU:\Software\TaskbarMonitor -Force | Out-Null
          Set-ItemProperty -Path HKCU:\Software\TaskbarMonitor -Name RingShowsNumber -Value 1 -Type DWord
          $p = Start-Process dist\standalone\TaskbarMonitor.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "TaskbarMonitor exited early (exit code $($p.ExitCode))" }
          Shot "screenshots\numbers.png"
          Stop-Process -Id $p.Id
          Write-Host "App ran without crashing."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

      - uses: actions/upload-artifact@v4
        with:
          name: TaskbarMonitor-standalone
          path: dist/standalone/TaskbarMonitor.exe

      - uses: actions/upload-artifact@v4
        with:
          name: TaskbarMonitor-small
          path: dist/small/TaskbarMonitor.exe

      # Also keep the latest screenshots on a separate branch so they can be viewed without
      # downloading artifacts (github.com/<owner>/<repo>/tree/ci-screenshots).
      - name: Publish screenshots to ci-screenshots branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $tmp = Join-Path $env:RUNNER_TEMP shots
          Copy-Item screenshots $tmp -Recurse
          git checkout --orphan ci-screenshots
          git rm -rf --quiet .
          Copy-Item "$tmp\*" .
          git add *.png *.csv *.txt
          git commit -m "Screenshots for $env:GITHUB_SHA"
          git push -f origin ci-screenshots
